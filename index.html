<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Doki Duck AI</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#707C5C" id="themeColorMeta">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow: #F5C242;
    --yellow-deep: #E8AF23;
    --olive: #707C5C;
    --olive-dark: #545E44;
    --cream: #F8F3E7;
    --ink: #241F18;
    --beak: #E29227;
    --beak-dark: #C97B1A;

    --toolbar-bg: #E4E4E4;
    --toolbar-border: #c9c9c9;
    --addr-bg: #ffffff;
    --addr-text: #4a4a4a;
    --app-bg1: #FBDA7C;
    --app-bg2: #F5C242;
    --app-bg3: #E8AF23;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0;
    height:100%;
    height:100dvh;
    background:#ddd;
    font-family:'Nunito', system-ui, sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    overflow:hidden;
  }
  .phone{
    width:100%;
    height:100%;
    height:100dvh;
    max-width:100%;
    background:
      radial-gradient(circle at 50% -10%, var(--app-bg1) 0%, var(--app-bg2) 55%, var(--app-bg3) 100%);
    border:none;
    border-radius:0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:none;
    position:relative;
    transition: background 0.5s ease;
  }
  .phone.incognito{
    background: radial-gradient(circle at 50% -10%, #4b4a58 0%, #2f2e3a 55%, #1c1b24 100%);
  }

  /* ---- fake browser toolbar ---- */
  .toolbar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 12px;
    background:var(--toolbar-bg);
    border-bottom:1px solid var(--toolbar-border);
    transition: background 0.5s ease, border-color 0.5s ease;
  }
  .phone.incognito .toolbar{
    background:#2b2a33;
    border-color:#454353;
  }
  .tabdot{
    width:9px;height:9px;border-radius:50%;
    background:#c7c7c7;
    flex-shrink:0;
  }
  .phone.incognito .tabdot{ background:#5b596a; }
  .addr-pill{
    flex:1;
    background:var(--addr-bg);
    border-radius:999px;
    padding:7px 12px;
    font-size:0.74rem;
    color:var(--addr-text);
    display:flex;
    align-items:center;
    gap:6px;
    min-width:0;
    transition: background 0.5s ease, color 0.5s ease;
  }
  .phone.incognito .addr-pill{ background:#3c3b47; color:#c9c6d6; }
  .addr-pill .lock{ font-size:0.7rem; flex-shrink:0; }
  .addr-pill span.url{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .incog-btn{
    width:32px;height:32px;
    border-radius:50%;
    border:none;
    background:transparent;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition: background 0.2s ease;
  }
  .incog-btn:hover{ background:rgba(0,0,0,0.06); }
  .phone.incognito .incog-btn{ background:rgba(255,255,255,0.12); }
  .phone.incognito .incog-btn:hover{ background:rgba(255,255,255,0.2); }
  .incog-btn svg{ width:19px; height:19px; }
  .incog-btn .glyph-fill{ fill:#5f5f5f; transition: fill 0.4s ease; }
  .phone.incognito .incog-btn .glyph-fill{ fill:#efeef5; }

  /* ---- header ---- */
  .header{
    background:var(--olive);
    color:var(--cream);
    padding:14px 18px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:3px solid var(--ink);
    transition: background 0.5s ease;
  }
  .phone.incognito .header{ background:#232230; }

  .avatar-wrap{
    position:relative;
    width:52px;
    height:52px;
    flex-shrink:0;
  }
  .avatar{
    width:52px;
    height:52px;
    border-radius:50%;
    border:3px solid var(--ink);
    overflow:hidden;
    background:var(--olive-dark);
  }
  .avatar img{width:100%;height:100%;object-fit:cover;display:block;}

  .sunglasses{
    position:absolute;
    top:38%;
    left:16%;
    width:68%;
    height:20%;
    pointer-events:none;
    opacity:0;
    transform:scale(0.4) translateY(-4px);
    transition: opacity 0.45s cubic-bezier(.2,.9,.3,1.3), transform 0.45s cubic-bezier(.2,.9,.3,1.3);
  }
  .phone.incognito .sunglasses{
    opacity:1;
    transform:scale(1) translateY(0);
  }
  .sunglasses svg{ width:100%; height:100%; display:block; overflow:visible; }

  .header-text{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .header-name{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.15rem;
    letter-spacing:0.2px;
  }
  .header-status{
    font-size:0.76rem;
    opacity:0.88;
    display:flex;
    align-items:center;
    gap:6px;
    transition: color 0.3s ease;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:#8FE38A;
    box-shadow:0 0 0 2px rgba(143,227,138,0.25);
    transition: background 0.3s ease;
  }
  .phone.incognito .dot{ background:#b39dff; box-shadow:0 0 0 2px rgba(179,157,255,0.25); }

  /* ---- messages ---- */
  .messages{
    flex:1;
    overflow-y:auto;
    padding:18px 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
    background:var(--cream);
    transition: background 0.5s ease;
  }
  .phone.incognito .messages{ background:#232230; }

  .row{display:flex; gap:8px; align-items:flex-end;}
  .row.user{justify-content:flex-end;}
  .row.bot{justify-content:flex-start;}
  .bubble{
    max-width:74%;
    padding:10px 14px;
    border-radius:16px;
    font-size:0.96rem;
    line-height:1.4;
    border:2px solid var(--ink);
    word-wrap:break-word;
    transition: background 0.4s ease, border-color 0.4s ease, color 0.4s ease;
  }
  .row.user .bubble{
    background:var(--yellow);
    border-bottom-right-radius:4px;
  }
  .row.bot .bubble{
    background:#fff;
    border-bottom-left-radius:4px;
  }
  .phone.incognito .row.user .bubble{
    background:#3c3b47; color:#d8d5e6; border-color:#5b596a; letter-spacing:2px;
  }
  .phone.incognito .row.bot .bubble{
    background:#2f2e3a; color:#eae7f5; border-color:#5b596a;
  }
  .row.bot .bubble.denied{
    background:#3a1f22 !important;
    color:#f3d6d6 !important;
    border-color:#7a3232 !important;
  }

  .bot-mini{
    width:26px;height:26px;border-radius:50%;
    border:2px solid var(--ink);
    overflow:hidden;flex-shrink:0;
    position:relative;
  }
  .bot-mini img{width:100%;height:100%;object-fit:cover;display:block;}
  .bot-mini .sunglasses{ top:36%; left:14%; width:72%; height:22%; }

  .quack-reply{font-weight:700; letter-spacing:0.3px;}

  .system-note{
    align-self:center;
    font-size:0.72rem;
    font-family:'JetBrains Mono', monospace;
    color:var(--olive-dark);
    background:#EFE7D2;
    border:1px dashed var(--olive);
    padding:5px 10px;
    border-radius:10px;
    text-align:center;
    max-width:90%;
    transition: all 0.4s ease;
  }
  .phone.incognito .system-note{
    color:#c9c1ff; background:#2c2a3d; border-color:#57508a;
  }

  /* ---- meter ---- */
  .meter{
    padding:6px 16px 0;
    font-family:'JetBrains Mono', monospace;
    font-size:0.72rem;
    color:var(--olive-dark);
    min-height:18px;
    background:var(--cream);
    transition: background 0.5s ease, color 0.4s ease;
  }
  .meter b{color:var(--beak-dark);}
  .phone.incognito .meter{ background:#232230; color:#8a84a8; }
  .phone.incognito .meter b{ color:#b39dff; }

  /* ---- input ---- */
  .inputbar{
    display:flex;
    gap:8px;
    padding:12px 14px 16px;
    background:var(--cream);
    border-top:3px solid var(--ink);
    transition: background 0.5s ease, border-color 0.5s ease;
  }
  .phone.incognito .inputbar{ background:#232230; border-color:#454353; }

  .inputbar input{
    flex:1;
    border:2px solid var(--ink);
    border-radius:14px;
    padding:11px 14px;
    font-size:0.95rem;
    font-family:'Nunito', sans-serif;
    outline:none;
    background:#fff;
    transition: background 0.4s ease, color 0.4s ease, border-color 0.4s ease;
  }
  .inputbar input:focus{
    box-shadow:0 0 0 3px rgba(226,146,39,0.35);
  }
  .phone.incognito .inputbar input{
    background:#141319; color:#e6e3f2; border-color:#5b596a;
  }
  .phone.incognito .inputbar input:focus{
    box-shadow:0 0 0 3px rgba(179,157,255,0.3);
  }
  .phone.incognito .inputbar input::placeholder{ color:#6b6784; }

  .send-btn{
    width:46px;height:46px;
    border-radius:50%;
    border:2px solid var(--ink);
    background:var(--beak);
    color:var(--ink);
    font-size:1.15rem;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:transform 0.12s ease, background 0.3s ease, border-color 0.3s ease;
  }
  .send-btn:hover{background:var(--beak-dark); transform:translateY(-1px);}
  .send-btn:active{transform:translateY(1px) scale(0.96);}
  .phone.incognito .send-btn{ background:#57508a; border-color:#8a84c9; color:#f0eefc; }
  .phone.incognito .send-btn:hover{ background:#453f70; }

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:#D9CDA9; border-radius:8px;}
  .phone.incognito ::-webkit-scrollbar-thumb{ background:#454358; }

  @media (prefers-reduced-motion: reduce){
    .send-btn, .sunglasses, .phone{ transition:none; }
  }
</style>
</head>

<script>

  const DENIED_MESSAGE = "Well done son, Doki Duck AI is not for you because you don't deserve it. You deserve cheap AI tools like ChatGPT or Claude.";

  let incognito = false;

  function countWords(text){
    return text.trim().split(/\s+/).filter(Boolean).length;
  }

  function quackCountFor(text){
    const n = countWords(text);
    if(n === 0) return 1;
    return Math.min(n, MAX_QUACKS);
  }

  function buildQuackReply(count){
    return Array(count).fill('Quack').join(' ') + ' 🦆';
  }

  function maskText(text){
    return text.trim().split(/\s+/).map(w => '•'.repeat(Math.min(w.length, 8))).join(' ');
  }

  function scrollToBottom(){
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addRow(text, who, denied){
    const row = document.createElement('div');
    row.className = 'row ' + who;

    if(who === 'bot'){
      row.insertAdjacentHTML('beforeend', botAvatarHTML());
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (who === 'bot' ? ' quack-reply' : '');
    if(denied) bubble.classList.add('denied');
    bubble.textContent = text;
    row.appendChild(bubble);

    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function handleSend(){
    const raw = inputEl.value;
    if(!raw.trim()) return;

    if(incognito){
      addRow(maskText(raw), 'user');
      inputEl.value = '';
      meterEl.innerHTML = '&nbsp;';
      setTimeout(function(){
        addRow(DENIED_MESSAGE, 'bot', true);
      }, 280);
      return;
    }

    addRow(raw, 'user');
    const count = quackCountFor(raw);
    inputEl.value = '';
    meterEl.innerHTML = '&nbsp;';
    setTimeout(function(){
      addRow(buildQuackReply(count), 'bot');
    }, 260);
  }

  sendBtn.addEventListener('click', handleSend);
  inputEl.addEventListener('keydown', function(e){
    if(e.key === 'Enter') handleSend();
  });

  inputEl.addEventListener('input', function(){
    if(incognito){
      meterEl.innerHTML = '&nbsp;';
      return;
    }
    const n = countWords(inputEl.value);
    if(n === 0){
      meterEl.innerHTML = '&nbsp;';
      return;
    }
    const capped = Math.min(n, MAX_QUACKS);
    const capNote = n > MAX_QUACKS ? ' (capped)' : '';
    meterEl.innerHTML = n + ' word' + (n===1?'':'s') + ' &rarr; <b>' + capped + ' quack' + (capped===1?'':'s') + capNote + '</b>';
  });

  function setIncognito(on){
    incognito = on;
    phone.classList.toggle('incognito', on);
    inputEl.type = on ? 'password' : 'text';
    inputEl.placeholder = on ? 'Type anything… (hidden)' : 'Type anything…';
    inputEl.value = '';
    meterEl.innerHTML = '&nbsp;';
    headerStatus.innerHTML = on
      ? '<span class="dot"></span> incognito mode — trust issues'
      : '<span class="dot"></span> knows exactly one word';
    themeColorMeta.setAttribute('content', on ? '#1c1b24' : '#707C5C');

    const note = document.createElement('div');
    note.className = 'system-note';
    note.textContent = on
      ? '🕵️ Incognito mode on — Doki can\'t see what you type anymore.'
      : '☀️ Incognito mode off — back to normal quacking.';
    messagesEl.appendChild(note);
    scrollToBottom();
  }

  incogBtn.addEventListener('click', function(){
    setIncognito(!incognito);
  });

})();
